apiVersion: v1
kind: ServiceAccount
metadata:
  name: clauzette
  namespace: ai
# No Kubernetes API token in the pod: exec_command could otherwise find it
# and use it against the cluster.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clauzette-config
  namespace: ai
data:
  # Only values that differ from the built-in defaults; see config.example.json.
  # Fill these in for your setup (config.json is JSON, so it can't hold comments):
  #  - "model": the Ollama model you pulled (see 10-ollama.yaml).
  #  - "num_ctx": bound by GPU VRAM. Pick the largest context that keeps the model
  #    100% on the GPU -- load it and check `ollama ps` shows "100% GPU" (not a
  #    CPU/GPU split). q8_0 KV cache + flash attention (10-ollama.yaml) stretch it.
  #  - "gpu": the guard below is written for a DCGM exporter (datacenter GPUs).
  #    For a CONSUMER GPU scraped by the nvidia_smi exporter, use instead:
  #      metrics_url  http://<nvidia-gpu-exporter-svc>:9835/metrics
  #      temp_metric  nvidia_smi_temperature_gpu
  #      util_metric  nvidia_smi_utilization_gpu_ratio     util_scale 100
  #  - "search": wires web_search to a SearXNG instance; allow_private lets it
  #    reach an in-cluster/private endpoint. Remove the block to disable search.
  config.json: |
    {
      "ollama_url": "http://ollama.ai.svc.cluster.local:11434",
      "model": "your-model:tag",
      "num_ctx": 131072,
      "workspace": "/workspace",
      "sessions_dir": "/state/sessions",
      "audit_log": "/state/audit.jsonl",
      "tools": { "shell": "/bin/bash" },
      "search": {
        "provider": "searxng",
        "endpoint": "http://searxng.ai.svc.cluster.local:8080",
        "max_results": 5,
        "allow_private": true
      },
      "gpu": {
        "enabled": true,
        "metrics_url": "http://nvidia-dcgm-exporter.gpu-operator.svc.cluster.local:9400/metrics",
        "mode": "temperature",
        "temp_metric": "DCGM_FI_DEV_GPU_TEMP",
        "util_metric": "DCGM_FI_DEV_GPU_UTIL",
        "util_scale": 1,
        "pause_above_c": 80,
        "resume_below_c": 70
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clauzette
  namespace: ai
  labels: {app: clauzette}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: clauzette}
  template:
    metadata:
      labels: {app: clauzette}
    spec:
      serviceAccountName: clauzette
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000            # files the agent creates stay usable by the group
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clauzette
          image: registry.local/clauzette:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["clauzette", "idle"]
          env:
            - {name: CLAUZETTE_CONFIG, value: /etc/clauzette/config.json}
            - {name: HOME, value: /home/agent}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "4", memory: 4Gi, ephemeral-storage: 2Gi}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: state, mountPath: /state}
            - {name: config, mountPath: /etc/clauzette, readOnly: true}
            - {name: home, mountPath: /home/agent}   # writable HOME for git, caches
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: shared-workspace   # your shared space
        - name: state
          persistentVolumeClaim:
            claimName: clauzette-state       # sessions + audit log
        - name: config
          configMap:
            name: clauzette-config
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
