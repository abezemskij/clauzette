name: ci
on:
  workflow_dispatch:                # allow a manual run (gh workflow run ci.yml)
  push:
    branches: [main]
    paths-ignore:                   # doc/cosmetic-only pushes don't build or deploy
      - '**.md'
      - 'media/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'media/**'
      - 'LICENSE'

concurrency:                      # serialize so bump commits don't race
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write                 # GITHUB_TOKEN pushes to the linked GHCR package

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test -race ./...    # the real gate

  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/abezemskij/clauzette:${{ steps.v.outputs.sha }}
            ghcr.io/abezemskij/clauzette:latest
          build-args: VERSION=${{ steps.v.outputs.sha }}

  bump-gitops:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: abezemskij/clauzette-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Bump image tag (kustomize) and push
        run: |
          cd gitops/clauzette
          yq -i '.images[0].newTag = "${{ needs.build-push.outputs.sha }}"' kustomization.yaml
          cd ..
          git config user.name  "clauzette-ci"
          git config user.email "clauzette-ci@users.noreply.github.com"
          git diff --quiet && { echo "no change"; exit 0; }
          git commit -am "clauzette: deploy ${{ needs.build-push.outputs.sha }}"
          git push
